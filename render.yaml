services:
  - type: web
    name: indiamart-moderation-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: moderation-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_PATH
        value: /var/data/moderation.db
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: indiamart-moderation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
